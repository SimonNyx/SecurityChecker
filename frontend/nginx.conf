server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve 'api' hostname on each request so container IP changes don't break the proxy.
    # NAMESERVER is injected by docker-entrypoint.sh from /etc/resolv.conf at startup.
    resolver NAMESERVER valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
